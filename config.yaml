# ===== アカウントの情報（ここだけ書き換えればOK） =====
account:
  name: "株式会社RARE STELLA"
  brand_line: "RARE STELLA ｜ MEO・SEO運用"
  business: "地域のお店・個人事業主向けに、Googleマップ集客（MEO）とSEOを運用ごと代行・伴走する"
  audience: "飲食店・美容室・サロンなど地域で商売をする個人店のオーナー"
  goal: "MEOに詳しい会社だと信頼してもらい、店名をDMで送ってもらう"
  cta: "店名をDMしてもらえれば、無料でお店のGoogleマップを見て改善点を伝える"
  tone: "専門的だけど、むずかしい言葉を使わず、オーナーの悩みに寄り添う"
  # 投稿に使ってよい事実（根拠を確認できたものだけ）
  facts:
    - "Google公式：ローカル検索の順位は主に「関連性」「距離」「知名度（人気度）」で決まる"
    - "Google公式：順位を上げるための依頼やお金は一切受け付けていない（お金で順位は買えない）"
    - "Google公式：写真を追加したビジネスは、経路リクエストが42%多く、ウェブサイトへのクリックが35%多い"
    - "Googleのガイドライン：口コミの見返りに割引や特典を渡すのは禁止"
    - "店名をキーワードで飾る（例：店名に「〇〇駅 居酒屋」を付け足す）のはGoogleのガイドライン違反"
    - "店名・住所・電話番号の書き方がサイトごとに違うと、Googleに正しく伝わりにくい"
    - "RARE STELLAは契約期間の縛りなし、1ヶ月単位で見直せる"
  never:
    - "順位や売上の保証"
    - "根拠のない数字や実績件数"
    - "架空の口コミ・お客様の声"

# 週ごとのテーマ（業種）。industry_start_week の週から順番にくり返す
industries: ["飲食店", "美容室・サロン"]
industry_start_week: 43

# 曜日ごとの種類（月〜日）。reel=リール動画、image=画像
schedule: ["reel", "image", "reel", "image", "reel", "image", "reel"]

# 投稿先
platforms:
  instagram: true
  threads: false

# 画像投稿のデザイン
design:
  colors: ["#13B5E0", "#0D3A9E"]
  accent: "#FFB000"

# 文章を作るAIモデル
model: "claude-sonnet-5-5"
