name: 今日の分を投稿する
on:
  schedule:
    - cron: "0 3 * * *"    # 毎日 12:00（日本時間）。GitHubの都合で数十分遅れることがあります
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テスト（実際には投稿しない）"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: sns-autopost
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python src/post.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: 投稿済みの記録を保存
        if: always()
        run: |
          git config user.name "sns-autopost"
          git config user.email "sns-autopost@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || git commit -m "投稿済みを記録"
          git push
