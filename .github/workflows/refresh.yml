name: トークンを延長する
on:
  schedule:
    - cron: "0 2 1,15 * *"  # 毎月1日と15日
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python src/refresh_tokens.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: 新しいトークンをSecretsに保存
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for f in /tmp/new_tokens/*; do
            [ -f "$f" ] || continue
            gh secret set "$(basename "$f")" --repo "$GITHUB_REPOSITORY" < "$f"
          done
          rm -rf /tmp/new_tokens
